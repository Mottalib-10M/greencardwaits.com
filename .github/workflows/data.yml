name: Monthly data refresh

# Du 5 au 25 de chaque mois : nouveau Visa Bulletin (adoptions.state.gov), tableau imposé par USCIS, délais USCIS (ImmigrationTimes.org,
# CC BY 4.0) et édition du barème G-1055. Si le bulletin ou les délais changent, les séries, le rétro-test et les
# tests sont relancés et le résultat est poussé sur main (le job relance alors deploy.yml : un push fait avec GITHUB_TOKEN ne déclenche pas les autres workflows). Si l'édition du G-1055 change, le job
# échoue : les frais se relisent à la main (CONTRIBUTING-PAGES.md). Les pages mensuelles du bulletin s'ajoutent à la main.
on:
  schedule:
    - cron: '23 14 5-25 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Visa Bulletin, séries et rétro-test
        run: node scripts/build-bulletins.ts --refresh && node scripts/build-forecast.ts
      - name: Tableau imposé par USCIS (filing charts)
        # Code 2 = page USCIS injoignable ou illisible : avertissement, aosChart reste tel quel.
        run: |
          rc=0; node scripts/build-aos-chart.mjs || rc=$?
          if [ "$rc" = 2 ]; then echo "::warning::Filing charts USCIS non lus : relire aosChart à la main"; elif [ "$rc" != 0 ]; then exit "$rc"; fi
      - name: Délais USCIS
        run: node scripts/build-ptimes.ts --refresh
      - name: Tests
        # Si les nouveaux délais USCIS cassent une page (ligne de bureau disparue, par ex. I-751 SCD le 2026-10-19),
        # on garde les délais du mois précédent pour ne pas bloquer le bulletin ; le job le signale.
        run: |
          if ! npx vitest run; then
            echo "::warning::Tests en échec avec les nouveaux délais USCIS : délais précédents conservés, à relire"
            git checkout -- src/data/ptimes.json src/data/ptimes-latest.json
            npx vitest run
          fi
      - name: Commit si les données ont changé
        run: |
          git config user.name "data-refresh"
          git config user.email "data-refresh@users.noreply.github.com"
          git add src/data
          if ! git diff --cached --quiet; then
            git commit -m "Données : bulletin et délais du $(date -u +%F)" && git push
            gh workflow run deploy.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # En dernier : une nouvelle édition du G-1055 fait échouer le job (frais à relire à la main) sans plus
      # bloquer le bulletin. Jusqu'au 2026-10-31 ce contrôle passait en premier et, en échec depuis le 16/10,
      # a empêché la lecture du bulletin de novembre 2026.
      - name: Édition du G-1055
        if: always()
        run: |
          rc=0; node scripts/check-g1055.mjs || rc=$?
          if [ "$rc" = 2 ]; then echo "::warning::uscis.gov/g-1055 injoignable : édition non vérifiée"; else exit "$rc"; fi
